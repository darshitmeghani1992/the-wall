<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your The Wall sign-in code</title>
</head>
<body style="margin:0;padding:32px 16px;background:#fbf9f4;color:#1e1e1e;font-family:Arial,Helvetica,sans-serif;">
  <main style="max-width:500px;margin:0 auto;border:1px solid #242424;border-radius:16px;background:#fff;padding:28px;">
    <p style="font-size:22px;font-weight:800;letter-spacing:-1px;margin:0 0 24px;">the wall<span style="color:#b9a300;">.</span></p>
    <h1 style="font-size:25px;line-height:1.25;margin:0 0 14px;">Your sign-in code</h1>
    <p style="font-size:16px;line-height:1.5;margin:0 0 20px;">Enter this code in The Wall to continue signing in:</p>
    <p style="border:2px solid #242424;border-radius:12px;background:#f3e300;letter-spacing:5px;font-size:32px;font-weight:800;text-align:center;padding:18px 8px;margin:0 0 20px;">{{ .Token }}</p>
    <p style="font-size:13px;line-height:1.5;color:#575757;margin:0;">This is a one-time verification code. Don't share it with anyone. If you didn't request a sign-in, you can ignore this email.</p>
  </main>
</body>
</html>
