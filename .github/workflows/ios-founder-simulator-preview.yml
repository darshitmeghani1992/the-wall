          openssl smime -encrypt -binary -aes256 -in "$RUNNER_TEMP/the-wall-simulator.zip" \
            -outform DER -out "$RUNNER_TEMP/the-wall-simulator.zip.der" "$RUNNER_TEMP/preview-recipient.pem"
          test -s "$RUNNER_TEMP/the-wall-simulator.zip.der"
      - name: Upload only the encrypted simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: the-wall-ios-241c643-encrypted
          path: ${{ runner.temp }}/the-wall-simulator.zip.der
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Stop the isolated simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "$WALL_IOS_DEVICE" ]]; then xcrun simctl shutdown "$WALL_IOS_DEVICE" || true; fi
