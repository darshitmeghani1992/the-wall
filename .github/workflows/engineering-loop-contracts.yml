name: Engineering loop contracts

on:
  pull_request:
    paths:
      - "scripts/engineering_loop_v2.py"
      - "scripts/tests/test_engineering_loop_v2.py"
      - "scripts/tests/test_engineering_cloud_policy_v2.py"
      - "config/engineering-cloud-v2.json"
      - "scripts/free_worker_preflight.py"
      - "scripts/tests/test_free_worker_preflight.py"
      - "scripts/gemini_free_smoke.py"
      - "scripts/tests/test_gemini_free_smoke.py"
      - ".github/workflows/gemini-free-auth-smoke.yml"
      - ".github/workflows/free-worker-smoke.yml"
      - ".github/workflows/engineering-loop-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatcher-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no network or credentials)
        run: |
          python -m unittest discover -s scripts/tests -p 'test_engineering_*v2.py' -v
          python -m unittest discover -s scripts/tests -p 'test_free_worker_preflight.py' -v
          python scripts/free_worker_preflight.py
          python -m unittest discover -s scripts/tests -p 'test_gemini_free_smoke.py' -v
      - name: Canonical queue dry run
        run: python scripts/engineering_loop_v2.py --workers 3
